<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="친구들이 안 되는 날만 표시하면, 모두 되는 날이 보여요" />
    <meta name="theme-color" content="#e5484d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@900&family=Nanum+Pen+Script&family=Bebas+Neue&family=Anton&family=Shrikhand&family=Montserrat:ital,wght@0,600;0,700;1,800&display=swap" rel="stylesheet" />
    <title>언제볼래</title>
    <script>
      // 저장해 둔 화면 모드를 그리기 전에 적용해서 새로고침할 때 깜빡이지 않게 한다
      try {
        var t = localStorage.getItem('meetup.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
